<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
html,body{background:#0b1220;color:#f5f7fb}

<body>
<div id="msiAuthGate" style="position:fixed;inset:0;z-index:99999;background:#0b1220;color:#f5f7fb;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif"><div style="width:min(430px,100%);background:#111827;border:1px solid #374151;border-radius:18px;padding:24px"><h2 style="margin:0 0 6px">MSI Financing Calculator</h2><p style="color:#9ca3af;font-size:12px">Authorized access only.</p><form id="msiLoginForm"><label>Email</label><input id="msiEmail" type="email" autocomplete="username" required style="width:100%;min-height:46px"><label>Password</label><input id="msiPassword" type="password" autocomplete="current-password" required style="width:100%;min-height:46px"><button type="submit" style="width:100%;min-height:46px;margin-top:12px">SIGN IN</button></form><div id="msiAuthMsg"></div></div></div>
<div id="calculatorApp" style="visibility:hidden"><h1>MSI Financing Calculator</h1></div>
<script src="./access-guard.js"></script>
</body>
