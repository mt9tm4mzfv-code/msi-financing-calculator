<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSI V2 Branch Diagnostic</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 16px;background:#f6f7f9;color:#222}
h1{font-size:24px}.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin:14px 0}
.ok{color:green;font-weight:bold}.bad{color:red;font-weight:bold}.warn{color:#d97706;font-weight:bold}
pre{white-space:pre-wrap;background:#111;color:#eee;padding:12px;border-radius:6px;min-height:80px}
button{padding:10px 14px;margin:4px 8px 4px 0;cursor:pointer}code{word-break:break-all}
</style>
</head>
<body>
<h1>MSI Financial Calculator V2 — Branch Diagnostic</h1>
<div class="card">
<h3>JS Load Check</h3>
<div id="scripts"></div>
</div>
<div class="card">
<h3>Runtime Values</h3>
<div><b>window.MSI_COPY_RESULT_FOOTER:</b> <pre id="footer"></pre></div>
<div><b>typeof window.copyResult:</b> <span id="copyType"></span></div>
<div><b>Version check:</b> <span id="version"></span></div>
</div>
<div class="card">
<h3>Clipboard Builder Tests</h3>
<button id="detailedBtn">Test Detailed Copy</button>
<button id="simpleBtn">Test Simple Copy</button>
<div id="status"></div>
<pre id="output">Run a test button.</pre>
</div>
<div class="card">
<h3>Cache / Runtime Info</h3>
<div><b>location.href:</b> <code id="href"></code></div><br>
<div><b>navigator.userAgent:</b> <code id="ua"></code></div>
</div>

<!-- Load the same competing scripts explicitly for branch diagnostics -->
<script src="ui-result-enhancements.js?v=62.26"></script>
<script src="interest-rate-controller.js?v=62.26"></script>
<script src="v62-8-promo-footer-c4.js?v=62.26"></script>
<script>
const targets=['ui-result-enhancements.js','interest-rate-controller.js','v62-8-promo-footer-c4.js'];
function render(){
  const srcs=[...document.scripts].map(s=>s.src);
  document.getElementById('scripts').innerHTML=targets.map(t=>{
    const loaded=srcs.some(s=>s.includes('/'+t));
    return '<div class="'+(loaded?'ok':'bad')+'">'+t+': '+(loaded?'LOADED':'NOT LOADED')+'</div>';
  }).join('');
  document.getElementById('footer').textContent=window.MSI_COPY_RESULT_FOOTER ?? '(undefined)';
  document.getElementById('copyType').textContent=typeof window.copyResult;
  const v=document.documentElement.innerHTML.includes('62.26')?'v62.26 loaded':'OLD version';
  document.getElementById('version').textContent=v;
  document.getElementById('version').className=v==='v62.26 loaded'?'ok':'bad';
  document.getElementById('href').textContent=location.href;
  document.getElementById('ua').textContent=navigator.userAgent;
}
function assess(text){
  const s=document.getElementById('status');
  const value=String(text||'');
  if(value.includes('Estimated computation only')){
    s.textContent='NEW FOOTER OK';s.className='ok';
  }else if(value.includes('Prices and promotions are subject to change')){
    s.textContent='OLD FOOTER STILL ACTIVE';s.className='bad';
  }else{s.textContent='NO DISCLAIMER';s.className='warn';}
}
function show(text){
  const value=String(text??'');
  const lines=value.split('\n');
  document.getElementById('output').textContent=lines.slice(-5).join('\n');
  assess(value);
}
async function resolveResult(result){
  if(result && typeof result.then==='function') result=await result;
  return result;
}
async function captureClipboard(run){
  let captured='';
  const clipboard=navigator.clipboard;
  const original=clipboard&&clipboard.writeText;
  try{
    if(clipboard&&typeof original==='function'){
      clipboard.writeText=async function(text){captured=String(text);};
    }
    const result=await resolveResult(run());
    return captured || result || '';
  }finally{
    if(clipboard&&original) clipboard.writeText=original;
  }
}
async function tryBuilder(label, fn, args=[0]){
  if(typeof fn!=='function') return null;
  const result=await resolveResult(fn(...args));
  if(result!==undefined && result!==null && String(result)!=='') return {label,text:String(result)};
  return null;
}
document.getElementById('detailedBtn').onclick=async()=>{
  try{
    let found=null;
    found=await tryBuilder('window.detailedCopy(0)',window.detailedCopy,[0]);
    if(!found && typeof window.copyResult==='function'){
      const text=await captureClipboard(()=>window.copyResult(0));
      if(text) found={label:'window.copyResult(0)',text:String(text)};
    }
    if(!found) return show('No detailed builder produced text.');
    show(found.text);
  }catch(e){show('ERROR: '+e.message);}
};
document.getElementById('simpleBtn').onclick=async()=>{
  try{
    let found=null;
    const candidates=[
      ['window.simpleCopyText(0)',window.simpleCopyText,[0]],
      ['window.buildSimpleCopy(0)',window.buildSimpleCopy,[0]],
      ['window.simplePlain(0)',window.simplePlain,[0]],
      ['window.MSI_COPY_SIMPLE(0)',window.MSI_COPY_SIMPLE,[0]]
    ];
    for(const [label,fn,args] of candidates){
      found=await tryBuilder(label,fn,args);
      if(found) break;
    }
    if(!found && typeof window.copyResult==='function'){
      const text=await captureClipboard(()=>window.copyResult(0));
      if(text) found={label:'window.copyResult(0)',text:String(text)};
    }
    if(!found) return show('No simple builder produced text.');
    show(found.text);
  }catch(e){show('ERROR: '+e.message);}
};
window.addEventListener('load',()=>setTimeout(render,100));
render();
</script>
</body>
</html>
